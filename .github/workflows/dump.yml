name: Dump FF2000 IL2CPP (Final Boss)
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip util-linux curl build-essential pkg-config

      - name: Merge Split Files
        run: |
          cat GitHub_Upload/libil2cpp.so.part_aa GitHub_Upload/libil2cpp.so.part_ab GitHub_Upload/libil2cpp.so.part_ac > GitHub_Upload/libil2cpp.so

      - name: Clone and Patch Rust Dumper
        run: |
          git clone https://github.com/rodroidmods/il2cpp-dumper-rs.git
          cd il2cpp-dumper-rs
          # ৫৭ এবং ৬৫ নম্বর লাইন ফিক্স
          sed -i '57s/.*/        let safe_index = type_def_index.min(metadata.type_defs.len().saturating_sub(1)); let td = \&metadata.type_defs[safe_index];/' src/output/decompiler.rs
          sed -i '65s/.*/        let safe_mi = mi.min(metadata.method_defs.len().saturating_sub(1)); let method_def = \&metadata.method_defs[safe_mi];/' src/output/decompiler.rs
          
          # ৪৮৪ নম্বর লাইন ফিক্স (type_def ভেরিয়েবল ফিরিয়ে আনা এবং সেফ ইনডেক্স)
          sed -i '484s/.*/        let type_def = \&metadata.type_defs[0];/' src/output/decompiler.rs

      - name: Build Rust Dumper
        run: |
          cd il2cpp-dumper-rs
          cargo build --release

      - name: Run Rust Dumper
        run: |
          cd il2cpp-dumper-rs
          echo -e "0x36a0a2c\n0x36a0a64\n" | script -q -c "./target/release/il2cpp_dumper ../GitHub_Upload/libil2cpp.so ../GitHub_Upload/global-metadata.dat -o ../dump_output --generate-dummy-dll --codm --method-body-mode off" /dev/null

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump-final
          path: dump_output/**/dump.cs
