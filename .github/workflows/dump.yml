name: Dump FF2000 IL2CPP
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip

      - name: Merge Split Files
        run: |
          cat GitHub_Upload/libil2cpp.so.part_aa GitHub_Upload/libil2cpp.so.part_ab GitHub_Upload/libil2cpp.so.part_ac > GitHub_Upload/libil2cpp.so

      - name: Download Il2CppDumper via gh CLI
        run: |
          # সঠিক ফাইলের নাম দিয়ে ডাউনলোড
          gh release download v6.7.40 --repo Perfare/Il2CppDumper --pattern "Il2CppDumper-net6.0-v6.7.40.zip"
          mkdir dumper
          unzip -o Il2CppDumper-net6.0-v6.7.40.zip -d dumper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dumper with .NET 6
        run: |
          cd dumper
          # mono এর বদলে dotnet দিয়ে রান
          dotnet Il2CppDumper.dll ../GitHub_Upload/libil2cpp.so ../GitHub_Upload/global-metadata.dat ../dump_output

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump
          path: dump_output/dump.cs
