name: Dump FF2000 IL2CPP
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip build-essential pkg-config

      - name: Merge Split Files
        run: |
          cat GitHub_Upload/libil2cpp.so.part_aa GitHub_Upload/libil2cpp.so.part_ab GitHub_Upload/libil2cpp.so.part_ac > GitHub_Upload/libil2cpp.so

      - name: Clone and Patch Rust Dumper
        run: |
          # সরাসরি রাস্ট ডাম্পার ক্লোন
          git clone https://github.com/rodroidmods/il2cpp-dumper-rs.git
          cd il2cpp-dumper-rs
          
          # এরর দেওয়া লাইনটাকে প্যাচ করা (index out of bounds fix)
          sed -i '57s/.*/        let safe_index = type_def_index.min(metadata.type_defs.len().saturating_sub(1)); let td = \&metadata.type_defs[safe_index];/' src/output/decompiler.rs

      - name: Build Rust Dumper
        run: |
          cd il2cpp-dumper-rs
          cargo build --release

      - name: Run Dumper with Manual Addresses
        run: |
          cd il2cpp-dumper-rs
          # ম্যানুয়াল অ্যাড্রেস পাইপ করা হচ্ছে
          echo -e "0x36a0a2c\n0x36a0a64\n" | ./target/release/il2cpp_dumper ../GitHub_Upload/libil2cpp.so ../GitHub_Upload/global-metadata.dat -o ../dump_output --generate-dummy-dll --codm

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump
          path: dump_output/Dump0/dump.cs
