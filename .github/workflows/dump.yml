name: Dump FF2000 IL2CPP
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mono-complete wget unzip

      - name: Merge Split Files
        run: |
          cat libil2cpp.so.part_aa libil2cpp.so.part_ab libil2cpp.so.part_ac > libil2cpp.so

      - name: Download Il2CppDumper
        run: |
          wget -q https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.40/Il2CppDumper-v6.7.40.zip
          mkdir dumper
          unzip -o Il2CppDumper-v6.7.40.zip -d dumper

      - name: Run Dumper
        run: |
          cd dumper
          mono Il2CppDumper.exe ../libil2cpp.so ../global-metadata.dat ../dump_output

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump
          path: dump_output/dump.cs
