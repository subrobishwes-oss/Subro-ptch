name: Dump FF2000 IL2CPP
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mono-complete unzip

      - name: Merge Split Files
        run: |
          cat GitHub_Upload/libil2cpp.so.part_aa GitHub_Upload/libil2cpp.so.part_ab GitHub_Upload/libil2cpp.so.part_ac > GitHub_Upload/libil2cpp.so

      - name: Download Il2CppDumper via gh CLI
        run: |
          # gh CLI দিয়ে রিলিজ ডাউনলোড (কোনো ব্লক নেই)
          gh release download v6.7.40 --repo Perfare/Il2CppDumper --pattern "Il2CppDumper-v6.7.40.zip"
          mkdir dumper
          unzip -o Il2CppDumper-v6.7.40.zip -d dumper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dumper with Mono
        run: |
          cd dumper
          mono Il2CppDumper.exe ../GitHub_Upload/libil2cpp.so ../GitHub_Upload/global-metadata.dat ../dump_output

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump
          path: dump_output/dump.cs
