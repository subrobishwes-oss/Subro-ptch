name: Dump FF2000 IL2CPP
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip

      - name: Merge Split Files
        run: |
          cat GitHub_Upload/libil2cpp.so.part_aa GitHub_Upload/libil2cpp.so.part_ab GitHub_Upload/libil2cpp.so.part_ac > GitHub_Upload/libil2cpp.so

      - name: Clone and Build Il2CppDumper
        run: |
          # সরাসরি সোর্স কোড ক্লোন
          git clone https://github.com/Perfare/Il2CppDumper.git
          cd Il2CppDumper
          dotnet build -c Release

      - name: Run Dumper with Manual Addresses
        run: |
          DUMPER_DLL=$(find Il2CppDumper -name "Il2CppDumper.dll" | head -n 1)
          # ম্যানুয়াল অ্যাড্রেস দুটো ইনপুট হিসেবে পাইপ করা হচ্ছে
          echo -e "0x36a0a2c\n0x36a0a64\n" | dotnet $DUMPER_DLL ../GitHub_Upload/libil2cpp.so ../GitHub_Upload/global-metadata.dat ../dump_output

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump
          path: dump_output/dump.cs
