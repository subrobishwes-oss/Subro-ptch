name: Dump FF2000 IL2CPP
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip util-linux

      - name: Merge Split Files
        run: |
          cat GitHub_Upload/libil2cpp.so.part_aa GitHub_Upload/libil2cpp.so.part_ab GitHub_Upload/libil2cpp.so.part_ac > GitHub_Upload/libil2cpp.so

      - name: Download Il2CppDumper (.NET 6) via gh CLI
        run: |
          # সঠিক প্যাটার্ন দিয়ে ডাউনলোড
          gh release download v6.7.40 --repo Perfare/Il2CppDumper --pattern "*net6*"
          mkdir dumper
          unzip *.zip -d dumper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dumper with Manual Addresses (Fake TTY)
        run: |
          cd dumper
          # script কমান্ড দিয়ে ফেক কিবোর্ড তৈরি করা হচ্ছে, যাতে ডাম্পার ইনপুট নিতে পারে
          echo -e "0x36a0a2c\n0x36a0a64\n" | script -q -c "dotnet Il2CppDumper.dll ../GitHub_Upload/libil2cpp.so ../GitHub_Upload/global-metadata.dat ../dump_output" /dev/null

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump
          path: dump_output/dump.cs
