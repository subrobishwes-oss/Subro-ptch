name: Dump FF2000 IL2CPP
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6 (Fix for missing framework)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip util-linux curl

      - name: Merge Split Files
        run: |
          cat GitHub_Upload/libil2cpp.so.part_aa GitHub_Upload/libil2cpp.so.part_ab GitHub_Upload/libil2cpp.so.part_ac > GitHub_Upload/libil2cpp.so

      - name: Download Il2CppDumper (.NET 6 Linux)
        run: |
          curl -L -o dumper.zip https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.40/Il2CppDumper-net6-v6.7.40.zip
          mkdir dumper
          unzip -o dumper.zip -d dumper

      - name: Run Dumper with Manual Addresses (Fake TTY)
        run: |
          cd dumper
          # এখানে .NET 6 দিয়েই রান হবে
          echo -e "0x36a0a2c\n0x36a0a64\n" | script -q -c "dotnet Il2CppDumper.dll ../GitHub_Upload/libil2cpp.so ../GitHub_Upload/global-metadata.dat ../dump_output" /dev/null

      - name: Upload Dump
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-dump
          path: dump_output/dump.cs
