name: Ghidra Headless Decompile
on: [push, workflow_dispatch]

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21 & Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl openjdk-21-jdk

      - name: Download & Setup Ghidra (Fixed Link)
        run: |
          # Ghidra 11.3.2 এর সরাসরি কারেক্ট লিংক
          curl -L -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip
          unzip -q ghidra.zip
          mv ghidra_11.3.2_PUBLIC ghidra

      - name: Download Decompile Script
        run: |
          # হেডলেস ডিকম্পাইল করার জাভা স্ক্রিপ্ট
          curl -L -o DecompileHeadless.java https://raw.githubusercontent.com/themactep/ghidra-headless-decompile/master/DecompileHeadless.java
          mv DecompileHeadless.java ghidra/Ghidra/Features/Decompiler/ghidra_scripts/

      - name: Run Ghidra Headless
        run: |
          # গিটহাবের ১৬ জিবি র্যামে Ghidra ডিকম্পাইল চালানো হচ্ছে
          ghidra/support/analyzeHeadless /tmp/ghidra_proj SubroProject \
            -import GitHub_Upload/libil2cpp.so \
            -postScript DecompileHeadless.java \
            -scriptPath ghidra/Ghidra/Features/Decompiler/ghidra_scripts \
            -deleteProject

      - name: Upload C Code
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-ghidra-code
          path: /tmp/ghidra_proj/*.c
