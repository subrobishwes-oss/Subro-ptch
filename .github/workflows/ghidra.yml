name: Ghidra Headless Decompile
on: [push, workflow_dispatch]

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Download & Setup Ghidra
        run: |
          # Ghidra 11.2 ডাউনলোড (সর্বশেষ স্টেবল ভার্সন)
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2_build/ghidra_11.2_PUBLIC_20241105.zip
          unzip -q ghidra_11.2_PUBLIC_20241105.zip
          mv ghidra_11.2_PUBLIC ghidra

      - name: Download Decompile Script
        run: |
          # হেডলেস ডিকম্পাইল করার জন্য জাভা স্ক্রিপ্ট
          wget -q https://raw.githubusercontent.com/themactep/ghidra-headless-decompile/master/DecompileHeadless.java -O ghidra/Ghidra/Features/Decompiler/ghidra_scripts/DecompileHeadless.java

      - name: Run Ghidra Headless
        run: |
          # লাইসেন্স অ্যাক্সেপ্ট করে হেডলেস অ্যানালাইসিস চালানো
          # PROJECT_PATH, PROJECT_NAME, -import, -postScript
          ghidra/support/analyzeHeadless /tmp/ghidra_proj SubroProject \
            -import GitHub_Upload/libil2cpp.so \
            -postScript DecompileHeadless.java \
            -scriptPath ghidra/Ghidra/Features/Decompiler/ghidra_scripts \
            -deleteProject

      - name: Upload Decompiled Code
        uses: actions/upload-artifact@v4
        with:
          name: ff2000-ghidra-c-code
          path: /tmp/ghidra_proj/*.c
