name: Hex Sniper Patcher
on: [push, workflow_dispatch]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -y && sudo apt-get install -y mono-complete
      - name: Find Offset and Patch
        run: |
          mcs -r:Mono.Cecil.dll OffsetFinder.cs
          mono OffsetFinder.exe > offset.txt
          cat offset.txt
      - name: Upload Patched DLL
        uses: actions/upload-artifact@v4
        with:
          name: patched-dll
          path: Assembly-CSharp_patched.dll
