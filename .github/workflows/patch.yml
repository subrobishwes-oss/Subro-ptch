name: Custom IL Patcher
on: [push, workflow_dispatch]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -y && sudo apt-get install -y mono-complete
      - name: Compile and Run Custom Patcher
        run: |
          mcs -r:Mono.Cecil.dll CustomPatcher.cs
          mono CustomPatcher.exe
      - name: Upload Patched DLL
        uses: actions/upload-artifact@v4
        with:
          name: patched-dll
          path: Assembly-CSharp_patched.dll
