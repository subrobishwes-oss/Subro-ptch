name: Subro Panel Builder
on: [push, workflow_dispatch]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -y && sudo apt-get install -y mono-complete
      - name: Generate Subro Patch
        run: |
          mono IFix.exe -patch IFix.Core.dll Assembly-CSharp.dll SubroPanel.dll IFixConfig_Patch.bin Assembly-CSharp-patch.bytes .
      - name: Upload Patch
        uses: actions/upload-artifact@v4
        with:
          name: subro-final-patch
          path: Assembly-CSharp-patch.bytes
