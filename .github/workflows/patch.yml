name: IFix Patcher
on: [push, workflow_dispatch]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -y && sudo apt-get install -y mono-complete
      - name: Inspect Dummy DLL
        run: |
          mcs -r:Mono.Cecil.dll Inspector.cs
          mono Inspector.exe
      - name: Patch Game with SakuraMod
        run: |
          mono IFix.exe -patch IFix.Core.dll Assembly-CSharp.dll Assembly-CSharp.dll IFixConfig_Patch.bin Assembly-CSharp-patch.bytes .
      - name: Debug - Check if file exists
        run: ls -la
      - name: Upload Patch
        uses: actions/upload-artifact@v4
        with:
          name: ifix-patch
          path: Assembly-CSharp-patch.bytes
