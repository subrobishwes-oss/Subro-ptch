name: Ultimate Dnlib + IFix Patcher
on: [push, workflow_dispatch]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -y && sudo apt-get install -y mono-complete unzip
      - name: Download dnlib
        run: |
          curl -sL -o dnlib.zip https://www.nuget.org/api/v2/package/dnlib/3.6.0
          unzip dnlib.zip -d dnlib_ext
          cp dnlib_ext/lib/net45/dnlib.dll .
      - name: Strip and Patch DLL
        run: |
          mcs -r:dnlib.dll UltimateGitPatcher.cs
          mono UltimateGitPatcher.exe
      - name: Generate IFix Patch
        run: |
          mono IFix.exe -patch IFix.Core.dll Assembly-CSharp.dll Assembly-CSharp_Stripped.dll IFixConfig_Patch.bin Assembly-CSharp-patch.bytes .
      - name: Upload Patch
        uses: actions/upload-artifact@v4
        with:
          name: final-subro-patch
          path: Assembly-CSharp-patch.bytes
