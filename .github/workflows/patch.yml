name: Hex Sniper and IFix Patcher
on: [push, workflow_dispatch]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono and pefile
        run: |
          sudo apt-get update -y && sudo apt-get install -y mono-complete
          pip install pefile
      - name: Hex Sniper Patch
        run: |
          python3 -c "data = bytearray(open('Assembly-CSharp.dll', 'rb').read()); data[821] = 0x2A; open('Assembly-CSharp_patched.dll', 'wb').write(data); print('Hex Sniper Patch Successful')"
      - name: Generate IFix Patch
        run: |
          mono IFix.exe -patch IFix.Core.dll Assembly-CSharp.dll Assembly-CSharp_patched.dll IFixConfig_Patch.bin Assembly-CSharp-patch.bytes .
      - name: Upload Patch
        uses: actions/upload-artifact@v4
        with:
          name: final-patch
          path: Assembly-CSharp-patch.bytes
