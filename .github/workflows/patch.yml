name: IFix Patcher
on: [push, workflow_dispatch]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -y && sudo apt-get install -y mono-complete
      - name: Inject VM into Game
        run: mono IFix.exe -inject IFix.Core.dll Assembly-CSharp.dll IFixConfig_Inject.bin Assembly-CSharp-patch.bytes injected_Assembly-CSharp.dll .
      - name: Inject SakuraMenu and Patch Game
        run: |
          mcs -r:Mono.Cecil.dll Injector.cs
          mono Injector.exe
          mono IFix.exe -patch IFix.Core.dll Assembly-CSharp.dll Assembly-CSharp_mod.dll IFixConfig_Patch.bin Assembly-CSharp-patch.bytes .
      - name: Debug - Check if file exists
        run: ls -la
      - name: Upload Patch
        uses: actions/upload-artifact@v4
        with:
          name: ifix-patch
          path: Assembly-CSharp-patch.bytes
